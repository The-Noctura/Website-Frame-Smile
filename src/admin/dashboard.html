<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="/src/admin/style.css">
    <title>Dashboard Admin</title>
</head>

<body>

    <div class="dashboard">

        <aside class="side-bar">
            <h3>Admin Panel</h3>

                    <article class="stat-card">
